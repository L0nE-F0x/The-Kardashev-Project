<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>titles</title>
<style>
@font-face { font-family: 'Atk'; src: url('/src/assets/fonts/atkinson-hyperlegible-next-latin.woff2') format('woff2'); font-weight: 200 800; }
:root { --gold: #fbd46e; --cream: #f6efe0; --cyan: #5fd3b5; --ink: #07060d; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Atk', sans-serif; color: var(--cream); }
body.tall #root { width: 1080px; height: 1920px; }
.el { position: absolute; will-change: transform, opacity; }
.full { inset: 0; }
/* a statement: a gold kicker over a big line, low in the frame */
.line { left: 0; right: 0; bottom: 118px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.line::before { content: ''; position: absolute; left: 50%; top: 50%; width: 1500px; height: 380px; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(5, 4, 12, 0.6), rgba(5, 4, 12, 0.32) 55%, rgba(5, 4, 12, 0) 100%); z-index: -1; }
.kicker { font-weight: 700; font-size: 25px; letter-spacing: 0.36em; padding-left: 0.36em; color: var(--gold); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75); }
.head { font-weight: 800; font-size: 86px; line-height: 1; padding-left: 0.05em; color: var(--cream); white-space: nowrap;
  text-shadow: 0 3px 0 rgba(10, 8, 20, 0.55), 0 8px 34px rgba(0, 0, 0, 0.7), 0 0 60px rgba(255, 206, 120, 0.22); }
.rule { width: 74px; height: 3px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 14px rgba(251, 212, 110, 0.7); }
body.tall .line { bottom: auto; top: 400px; gap: 20px; }
body.tall .line::before { width: 1300px; height: 520px; }
body.tall .head { font-size: 92px; white-space: normal; max-width: 960px; line-height: 1.04; }
body.tall .kicker { font-size: 27px; max-width: 900px; line-height: 1.5; }
/* the act, top left */
.chip { left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 21px; letter-spacing: 0.26em; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgba(251, 212, 110, 0.9); }
.chip b { color: var(--gold); font-weight: 800; }
.chip span { color: var(--cream); }
.chip em { font-style: normal; color: rgba(246, 239, 224, 0.62); letter-spacing: 0.18em; }
body.tall .chip { left: 56px; top: 230px; font-size: 23px; }
/* the Kardashev read-out, top right */
.k { right: 64px; top: 46px; text-align: right; }
.k small { display: block; font-weight: 700; font-size: 15px; letter-spacing: 0.34em; color: var(--cyan); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); margin-bottom: 4px; }
.k b { display: block; font-weight: 800; font-size: 46px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; color: var(--cream); text-shadow: 0 2px 0 rgba(8, 20, 18, 0.6), 0 0 22px rgba(95, 211, 181, 0.5), 0 4px 18px rgba(0, 0, 0, 0.7); }
.k b u { text-decoration: none; color: var(--gold); margin-right: 0.22em; }
.k .bar { margin-top: 8px; margin-left: auto; width: 250px; height: 4px; border-radius: 2px; background: rgba(246, 239, 224, 0.2); overflow: hidden; }
.k .bar s { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); box-shadow: 0 0 10px rgba(251, 212, 110, 0.8); }
body.tall .k { right: 56px; top: 150px; }
/* K 1.0000 */
.big { left: 0; right: 0; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.big::before { content: ''; position: absolute; left: 50%; top: 50%; width: 1700px; height: 620px; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(5, 4, 12, 0.5), rgba(5, 4, 12, 0.22) 60%, rgba(5, 4, 12, 0) 100%); z-index: -1; }
.big .kicker { font-size: 28px; }
.big .head { font-size: 210px; color: var(--gold); letter-spacing: 0.01em; font-variant-numeric: tabular-nums;
  text-shadow: 0 5px 0 rgba(60, 34, 6, 0.7), 0 0 70px rgba(251, 212, 110, 0.75), 0 0 190px rgba(255, 150, 50, 0.5), 0 10px 40px rgba(0, 0, 0, 0.6); }
body.tall .big .head { font-size: 168px; }
body.tall .big .kicker { font-size: 26px; }
/* the end card */
.logo { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.logo img { width: 1060px; height: auto; filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 50px rgba(251, 212, 110, 0.18)); }
.logo .tag { margin-top: 26px; font-weight: 800; font-size: 44px; letter-spacing: 0.2em; padding-left: 0.2em; color: var(--gold); text-shadow: 0 3px 0 rgba(60, 34, 6, 0.6), 0 0 36px rgba(251, 212, 110, 0.45), 0 6px 24px rgba(0, 0, 0, 0.7); }
.logo .cta { margin-top: 54px; padding: 15px 34px 15px 40px; border: 2px solid rgba(246, 239, 224, 0.85); border-radius: 999px; font-weight: 800; font-size: 28px; letter-spacing: 0.3em; color: var(--cream); background: rgba(8, 7, 16, 0.45); }
.logo .sub { margin-top: 26px; font-weight: 600; font-size: 24px; letter-spacing: 0.06em; color: rgba(246, 239, 224, 0.86); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
.logo .url { margin-top: 12px; font-weight: 700; font-size: 27px; letter-spacing: 0.05em; color: var(--cyan); text-shadow: 0 0 20px rgba(95, 211, 181, 0.5), 0 2px 10px rgba(0, 0, 0, 0.8); }
.logo.small img { width: 880px; }
.logo.small .tag { font-size: 36px; }
body.tall .logo img { width: 940px; }
body.tall .logo .tag { font-size: 37px; letter-spacing: 0.14em; margin-top: 30px; }
body.tall .logo .cta { font-size: 30px; margin-top: 64px; }
body.tall .logo .sub { font-size: 25px; max-width: 800px; text-align: center; line-height: 1.5; }
body.tall .logo .url { font-size: 29px; margin-top: 16px; }
/* the time of day, for the day-in-sixteen-seconds clip */
.clock { left: 64px; bottom: 60px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
.clock b { display: block; font-weight: 800; font-size: 64px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock small { display: block; font-weight: 700; font-size: 17px; letter-spacing: 0.3em; color: var(--gold); margin-top: 2px; }
body.tall .clock { left: 56px; bottom: 420px; }
body.tall .clock b { font-size: 84px; }
body.tall .clock small { font-size: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Draws the frame of titles at a time t (seconds). Everything is a function of t: no CSS animation, so a frame is
// the same whenever and however often it is drawn.
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let ED = null, els = [];
window.setup = (edit, tall) => {
  ED = edit;
  document.body.classList.toggle('tall', !!tall);
  const root = document.getElementById('root');
  root.innerHTML = '';
  els = [];
  const add = (cls, html, item) => { const el = document.createElement('div'); el.className = 'el ' + cls; el.innerHTML = html; el.style.display = 'none'; root.appendChild(el); els.push({ el, item }); return el; };
  for (const it of edit.titles) {
    if (it.kind === 'line') add('line', (it.kicker ? `<div class="kicker">${esc(it.kicker)}</div><div class="rule"></div>` : '') + `<div class="head">${esc(it.head)}</div>`, it);
    else if (it.kind === 'big') add('big', `<div class="kicker">${esc(it.kicker)}</div><div class="rule"></div><div class="head">${esc(it.head)}</div>`, it);
    else if (it.kind === 'chip') add('chip', `<i></i><b>${esc(it.text)}</b><span>${esc(it.name)}</span>${it.year ? `<em>· ${esc(it.year)}</em>` : ''}`, it);
    else if (it.kind === 'logo') add('logo' + (it.small ? ' small' : ''), `<img src="/logo.png"><div class="tag">${esc(it.tag)}</div><div class="cta">${esc(it.cta)}</div><div class="sub">${esc(it.sub)}</div><div class="url">${esc(it.url)}</div>`, it);
    else if (it.kind === 'clock') add('clock', `<b></b><small>${esc(it.place)}</small>`, it);
    else if (it.kind === 'flash' || it.kind === 'fade' || it.kind === 'dim') add('full', '', it);
  }
  if (edit.k) add('k', `<small>KARDASHEV SCALE</small><b></b><div class="bar"><s></s></div>`, { kind: 'k', ...edit.k });
  return Promise.all([document.fonts.load('800 40px Atk'), document.fonts.load('700 40px Atk'), document.fonts.load('600 40px Atk'), ...[...document.images].map((i) => i.decode().catch(() => {}))]);
};
/** Draw t; returns a signature of what is on screen ('' = nothing), so the renderer can skip frames that repeat. */
window.draw = (t) => {
  if (!ED) throw new Error('the titles page was reloaded: render again');
  const sig = [];
  for (const { el, item: it } of els) {
    const s = el.style;
    let on = true, key = '';
    if (it.kind === 'line') {
      const a = t - it.t0, b = it.t1 - t;
      on = a >= 0 && b > 0;
      if (on) {
        const i = ease(a / 0.5), o = smooth(b / 0.32), k = i * o;
        s.opacity = k.toFixed(3);
        s.filter = i < 1 ? `blur(${((1 - i) * 12).toFixed(2)}px)` : o < 1 ? `blur(${((1 - o) * 6).toFixed(2)}px)` : 'none';
        s.transform = `translateY(${((1 - i) * 22).toFixed(2)}px) scale(${(1 + a * 0.006).toFixed(4)})`;
        el.querySelector('.head').style.letterSpacing = (0.05 + (1 - i) * 0.1).toFixed(4) + 'em';
        const r = el.querySelector('.rule'); if (r) r.style.width = (74 * ease((a - 0.1) / 0.5)).toFixed(1) + 'px';
        key = `${s.opacity}|${s.filter}|${s.transform}`;
      }
    } else if (it.kind === 'big') {
      const a = t - it.t0, b = it.t1 - t;
      on = a >= 0 && b > 0;
      if (on) {
        const i = ease(a / 0.22), o = smooth(b / 0.3);
        s.opacity = (clamp(a / 0.08) * o).toFixed(3);
        s.transform = `translateY(-50%) scale(${(1.32 - 0.32 * i + a * 0.012).toFixed(4)})`;
        s.filter = o < 1 ? `blur(${((1 - o) * 8).toFixed(2)}px)` : 'none';
        key = `${s.opacity}|${s.transform}|${s.filter}`;
      }
    } else if (it.kind === 'chip') {
      const a = t - it.t0, b = it.t1 - t;
      on = a >= 0 && b > 0;
      if (on) {
        const i = ease(a / 0.45), o = smooth(b / 0.35);
        s.opacity = (i * o).toFixed(3);
        s.transform = `translateX(${((1 - i) * -30).toFixed(2)}px)`;
        key = `${s.opacity}|${s.transform}`;
      }
    } else if (it.kind === 'logo') {
      const a = t - it.t0;
      on = a >= 0 && t < it.t1;
      if (on) {
        const part = (sel, d, dy = 14) => { const e = el.querySelector(sel), k = ease((a - d) / 0.8); e.style.opacity = k.toFixed(3); e.style.transform = `translateY(${((1 - k) * dy).toFixed(2)}px)`; return k.toFixed(3); };
        const img = el.querySelector('img'), k0 = ease(a / 1.0);
        img.style.opacity = k0.toFixed(3);
        img.style.transform = `scale(${(0.93 + 0.07 * k0 + a * 0.0025).toFixed(4)})`;
        key = [k0.toFixed(3), img.style.transform, part('.tag', 0.45), part('.cta', 0.95), part('.sub', 1.25), part('.url', 1.4)].join('|');
      }
    } else if (it.kind === 'flash') {
      const a = t - it.t;
      on = a >= -0.034 && a < 0.9;
      if (on) { const k = a < 0 ? it.a * 0.5 : it.a * Math.exp(-a / 0.16); on = k > 0.004; s.background = '#fff6e6'; s.opacity = k.toFixed(3); key = s.opacity; }
    } else if (it.kind === 'fade') {
      on = t >= it.t0 && t <= it.t1 + 1e-6;
      if (on) { const k = it.from + (it.to - it.from) * smooth((t - it.t0) / (it.t1 - it.t0)); on = k > 0.002; s.background = '#000'; s.opacity = k.toFixed(3); key = s.opacity; }
    } else if (it.kind === 'dim') {
      on = t >= it.t0 && t <= it.t1;
      if (on) { const k = it.a * smooth((t - it.t0) / it.ramp); on = k > 0.002; s.background = 'radial-gradient(ellipse at 50% 46%, rgba(4,4,12,0.85), rgba(4,4,12,1) 78%)'; s.opacity = k.toFixed(3); key = s.opacity; }
    } else if (it.kind === 'clock') {
      on = t >= it.t0 && t < it.t1;
      if (on) {
        const K = it.keys; let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const h = (K[i][1] + (K[i + 1][1] - K[i][1]) * clamp((t - K[i][0]) / (K[i + 1][0] - K[i][0]))) % 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 5) * 5;
        const txt = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
        el.querySelector('b').textContent = txt;
        s.opacity = (ease((t - it.t0) / 0.5) * smooth((it.t1 - t) / 0.4)).toFixed(3);
        key = txt + s.opacity;
      }
    } else if (it.kind === 'k') {
      // hidden over the interface shots (they show the game's own read-out) and once the big number has landed
      let vis = smooth((t - it.from) / 0.6) * smooth((it.to - t) / 0.12 + 1);
      if (t >= it.to) vis = 0;
      for (const [a, b] of ED.hud ?? []) vis *= 1 - smooth((t - a) / 0.12 + 1) * smooth((b - t) / 0.12 + 1);
      on = vis > 0.004;
      if (on) {
        const K = it.keys;
        let i = 0;
        while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const u = clamp((t - K[i][0]) / (K[i + 1][0] - K[i][0]));
        const v = K[i][1] + (K[i + 1][1] - K[i][1]) * u;
        const txt = v.toFixed(4);
        el.querySelector('b').innerHTML = '<u>K</u>' + txt;
        el.querySelector('s').style.width = (clamp((v - 0.7) / 0.3) * 100).toFixed(2) + '%';
        s.opacity = vis.toFixed(3);
        key = txt + '|' + s.opacity;
      }
    }
    s.display = on ? '' : 'none';
    if (on) sig.push(key);
    else sig.push('');
  }
  return sig.some((x) => x) ? sig.join('~') : '';
};
</script>
</body>
</html>
