<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portrait sheet</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; background: #16141f; color: #c3bcc7; font: 12px/1.3 system-ui, sans-serif; }
      #sheet { display: flex; flex-direction: column; gap: 10px; padding: 14px; width: max-content; }
      .row { display: flex; gap: 10px; align-items: flex-start; }
      .row > b { width: 86px; padding-top: 8px; color: #e6e0e3; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .cell span { color: #9d95a6; font-size: 11px; }
      .pair { display: flex; gap: 6px; align-items: flex-end; }
      img { display: block; border-radius: 10%; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.16), 0 3px 10px -3px rgb(0 0 0 / 0.6); }
      h1 { font-size: 14px; margin: 0; color: #fbf7f0; }
    </style>
  </head>
  <body>
    <!-- Dev only (not part of the build): /play/portraits.html?set=advisors|ages|ceos|governors|bit|ais|all&big=120&small=40 -->
    <div id="sheet"></div>
    <script type="module" src="/src/render3d/portraits/sheet.ts"></script>
  </body>
</html>
