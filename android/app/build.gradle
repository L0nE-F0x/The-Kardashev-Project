/*
 * The Kardashev Project for Android: a small WebView app around the live web game (see
 * LauncherActivity.java). Started from a Bubblewrap (Trusted Web Activity) project in v0.4.2; since
 * v0.5.0 it runs the game in its own WebView because some phones block the hand-off to Chrome.
 */

import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def site = [
    hostName: 'thekardashevproject.netlify.app',
    launchPath: '/play/?app=android', // the web game knows ?app=android means "inside the app"
    name: 'The Kardashev Project',
    launcherName: 'Kardashev',
    backgroundColor: '#0B0A12',
]

// The app's version follows package.json (0.5.0 → versionCode 500), so a release only bumps
// package.json. The app opens the live site, so web updates need no new APK.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version as String
def appVersionParts = appVersion.tokenize('.').collect { it as int }
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

android {
    compileSdkVersion 36
    namespace "com.lonefox.kardashevproject"
    defaultConfig {
        applicationId "com.lonefox.kardashevproject"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersion

        resValue "string", "appName", site.name
        resValue "string", "launcherName", site.launcherName
        resValue "string", "hostName", site.hostName
        resValue "string", "launchUrl", "https://" + site.hostName + site.launchPath
        resValue "color", "backgroundColor", site.backgroundColor
    }
    // Release signing: the keystore never lives in the repo. CI decodes it from a secret; locally,
    // point KP_ANDROID_KEYSTORE at ~/.config/kardashev-project/android/kardashev-release.p12.
    // Never change the key: phones only accept updates signed with the same one.
    signingConfigs {
        release {
            def ks = System.getenv('KP_ANDROID_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KP_ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'kardashev'
                keyPassword System.getenv('KP_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KP_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
}
