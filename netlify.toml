[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # match the local toolchain (Vite 8 + TypeScript 7)
  NODE_VERSION = "26"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify doesn't know the .webmanifest type; browsers cope, but serve it properly
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
