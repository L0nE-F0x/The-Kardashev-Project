name: Desktop builds

# Builds the Windows, macOS and Linux installers and attaches them to a *draft* GitHub release.
# Run it by pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) or from the
# Actions tab. Publish the draft when you're happy — the website's Download buttons read the
# latest published release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage + deb)
            os: ubuntu-24.04
            args: ''
          - name: Windows (installer)
            os: windows-latest
            args: ''
          - name: macOS (universal dmg)
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: The Kardashev Project v__VERSION__
          releaseBody: |
            Download the installer for your computer below, or play in the browser at https://thekardashevproject.netlify.app/play/

            These builds are not code-signed yet, so your computer will ask before opening them:
            - **Windows:** on the SmartScreen notice, click *More info → Run anyway*.
            - **macOS:** right-click the app → *Open*, or System Settings → Privacy & Security → *Open Anyway*.
            - **Linux:** `chmod +x` the AppImage and run it, or install the .deb.

            What's new: https://thekardashevproject.netlify.app/#news
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
