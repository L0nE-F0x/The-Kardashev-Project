name: Release builds

# Builds the Windows, macOS and Linux Electron installers and attaches them (plus electron-updater
# manifests) to a *draft* GitHub release.
# Run it by pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) or from the Actions tab.
# Publish the draft when you're happy — the website's Download buttons read the latest published release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
          else
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --draft --title "The Kardashev Project ${TAG}" --notes-file - <<'EOF'
          Download the installer for your computer below (Windows, macOS or Linux).

          These builds are not code-signed yet, so your computer will ask before opening them:
          - **Windows:** on the SmartScreen notice, click *More info → Run anyway*.
          - **macOS:** right-click the app → *Open*, or System Settings → Privacy & Security → *Open Anyway*.
          - **Linux:** `chmod +x` the AppImage and run it (Arch-based distros may need `fuse2`), or install the `.deb`.

          Already installed? Direct GitHub downloads offer each new version in game: press *Update*.

          What's new: https://thekardashevproject.netlify.app/#news
          EOF
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage + deb)
            os: ubuntu-24.04
            builder_args: --linux AppImage deb
          - name: Windows (NSIS installer)
            os: windows-latest
            builder_args: --win nsis
          - name: macOS (Universal dmg + zip)
            os: macos-latest
            builder_args: --mac dmg zip --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Run test suite
        if: runner.os == 'Linux'
        run: npm test

      - name: Build game bundle
        run: npm run build

      - name: Package desktop installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer artifacts found in dist-desktop/"
            exit 1
          fi
          ls -lh "${files[@]}"
          gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
