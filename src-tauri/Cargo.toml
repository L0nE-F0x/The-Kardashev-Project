[package]
name = "kardashev-project"
version = "0.2.0"
description = "The Kardashev Project: a cozy-but-real pixel-art sim of the AI boom"
authors = ["Lone Fox"]
repository = "https://github.com/L0nE-F0x/The-Kardashev-Project"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kardashev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
# the update download (src/fastdl.rs): the same reqwest, rustls and tokio the updater already brings in
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# small, fast release binaries
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
